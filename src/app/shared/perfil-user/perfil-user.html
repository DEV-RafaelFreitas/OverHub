<div class="perfil-header">
    <h2>Perfil do Usuário</h2>
    <p>Bem-vindo, {{ usuario.nome }}!</p>
    <p>{{ usuario.email }}</p>
</div>

<main class="perfil-container">

    <aside class="card-menu-lateral">
        <button class="btn-menu" (click)="alterarDados()"> Alterar Dados </button>
        <button class="btn-menu" (click)="novaSenha()"> Nova Senha </button>
        <button class="btn-menu" (click)="excluirConta()"> Excluir Conta </button>
        <button class="btn-menu" (click)="logout()"> Logout </button>
        <button class="btn-menu" (click)="historicoCompras()"> Histórico de Compras </button>
    </aside>

    <div class="card-dados">
        
        <div class="container" name="dados-cadastrais">
            <h4>Dados do Usuário</h4>
            <label class="form-label">Nome Completo: </label>
            <input type="text" id="nome" [(ngModel)]="usuario.nome">
            <label class="form-label">CPF: </label>
            <input type="text" id="cpf" [(ngModel)]="usuario.cpf">
            <label class="form-label">E-mail: </label>
            <input type="email" id="email" [(ngModel)]="usuario.email">
            <label class="form-label">Telefone: </label>
            <input type="text" id="telefone" [(ngModel)]="usuario.telefone">
        </div>

        <div class="container" name="endereco-cadastrado">
            <h4>Endereço Cadastrado</h4>
            <label class="form-label">Endereço: </label>
            <input type="text" id="endereco" [(ngModel)]="usuario.endereco">
            <label class="form-label">Número: </label>
            <input type="text" id="numero" [(ngModel)]="usuario.numero">
            <label class="form-label">Complemento: </label>
            <input type="text" id="complemento" [(ngModel)]="usuario.complemento">
            <label class="form-label">Bairro:</label>
            <input type="text" id="bairro" [(ngModel)]="usuario.bairro">
            <label class="form-label">Cidade: </label>
            <input type="text" id="cidade" [(ngModel)]="usuario.cidade">
            <label class="form-label">Estado: </label>
            <input type="text" id="estado" [(ngModel)]="usuario.estado">
        </div>

        <div class="container" name="endereco-entrega">
            <h4>Endereço de Entrega</h4>
            <label class="form-label"> CEP: </label>
            <input type="text" id="cep" [(ngModel)]="enderecoEntrega.cep">
            <label class="form-label">Endereço: </label>
            <input type="text" id="endereco" [(ngModel)]="enderecoEntrega.endereco">
            <label class="form-label">Número: </label>
            <input type="text" id="numero" [(ngModel)]="enderecoEntrega.numero">
            <label class="form-label">Complemento: </label>
            <input type="text" id="complemento" [(ngModel)]="enderecoEntrega.complemento">
            <label class="form-label">Bairro:</label>
            <input type="text" id="bairro" [(ngModel)]="enderecoEntrega.bairro">
            <label class="form-label">Cidade: </label>
            <input type="text" id="cidade" [(ngModel)]="enderecoEntrega.cidade">
            <label class="form-label">Estado: </label>
            <input type="text" id="estado" [(ngModel)]="enderecoEntrega.estado">
        </div>
    </div> 
</main>
