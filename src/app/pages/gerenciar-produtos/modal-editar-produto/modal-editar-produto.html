<app-modal maxWidth="80vw">
  <div class="modal-header">
    <h2>Editar Produto</h2>
    <button (click)="onCancel()" type="button" aria-label="Fechar">
      <i class="material-icons">close</i>
    </button>
  </div>

  <form class="modal-content" (ngSubmit)="onSave()">
    <div class="form-grid">
      <div class="left-col">
        <label for="product-name-id" class="field-name">Nome do Produto</label>
        <input id="product-name-id" type="text" [(ngModel)]="nome" name="nome" placeholder="Nome" required>

        <label for="product-price-id" class="field-name">Preço do Produto (R$)</label>
        <input id="product-price-id" type="number" step="0.01" [(ngModel)]="preco" name="preco" placeholder="Preço" required>

        <label for="product-stock-id" class="field-name">Quantidade em estoque</label>
        <input id="product-stock-id" type="number" [(ngModel)]="estoque" name="estoque" placeholder="Estoque" required>

        <label for="product-category-id" class="field-name">Categoria</label>
        <input id="product-category-id" type="text" [(ngModel)]="categoria" name="categoria" placeholder="Categoria">
      </div>

      <div class="right-col">
        <label for="product-picture-id" class="field-name">Foto do Produto</label>
        <img class="prod-pic" [src]="imagem" alt="Foto do produto">
        <input id="product-picture-id" type="file" accept="image/*" (change)="onFileSelected($event)">
        <input type="text" [(ngModel)]="imagem" name="imagem" placeholder="Ou cole a URL da imagem" style="font-size: 0.8rem; margin-top: 4px;">
      </div>
    </div>

    <label for="product-desc-id" class="field-name">Descrição do Produto</label>
    <textarea id="product-desc-id" [(ngModel)]="descricao" name="descricao" placeholder="Insira a descrição do produto..." cols="30" rows="6"></textarea>

    <div class="modal-actions">
      <button type="button" class="cancel" (click)="onCancel()">Voltar</button>
      <button type="submit" class="confirm">Salvar</button>
    </div>
  </form>
</app-modal>
