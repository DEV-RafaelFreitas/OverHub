<app-modal>
  <div class="modal-header">
    <h2>Deletar Produto</h2>
    <i class="material-icons">warning</i>
  </div>

  <p>
    Tem certeza de que deseja excluir o item
    @if (produto()?.nome) {
      <strong>"{{ produto()?.nome }}"</strong>
    } @else {
      este item
    }?
    Lembre-se que esta alteração não poderá ser desfeita!
  </p>

  <div class="modal-actions">
    <button class="cancel" (click)="onCancel()" type="button">Cancelar</button>
    <button class="confirm" (click)="onDelete()" type="button">Deletar</button>
  </div>
</app-modal>
