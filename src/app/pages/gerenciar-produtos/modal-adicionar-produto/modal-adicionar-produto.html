<app-modal maxWidth="80vw">
  <div class="modal-header">
    <h2>Adicionar Produto</h2>
    <button>
      <i class="material-icons">close</i>
    </button>
  </div>

  <div class="modal-content">
    <div class="form-grid">
      <div class="left-col">
        <label for="product-name-id" class="sr-only">Nome do Produto</label>
        <input id="product-name-id" type="text" placeholder="Nome">

        <label for="product-price-id" class="sr-only">Preço do Produto</label>
        <input id="product-price-id" type="text" placeholder="Preço">

        <label for="product-stock-id" class="sr-only">Quantidade em estoque do Produto</label>
        <input id="product-stock-id" type="text" placeholder="Estoque">


      </div>

      <div class="right-col">
        <label for="product-picture-id" class="sr-only">Fazer upload de foto do Produto</label>
        <img class="prod-pic" src="https://static.thenounproject.com/png/5191452-200.png" alt="Foto do produto">
        <input id="product-picture-id" type="file">

      </div>
    </div>

    <label for="product-desc-id" class="sr-only">Descrição do Produto</label>
    <textarea id="product-desc-id" placeholder="Insira a descrição do produto..." cols="30" rows="10"></textarea>
  </div>

  <div class="modal-actions">
    <button class="cancel">Voltar</button>
    <button class="confirm">Adicionar</button>
  </div>
</app-modal>
