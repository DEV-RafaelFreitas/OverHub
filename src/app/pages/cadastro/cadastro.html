<form class="cartao">
  <h1> Criar Conta </h1>
  <p class="subtitulo">Informe os seus dados abaixo.</p>

  <div class="linha">
    <input type="text" name="nome" placeholder="Nome" [(ngModel)]="clientes.nome">
    <input type="text" name="sobrenome" placeholder="Sobrenome" [(ngModel)]="clientes.sobrenome">
  </div>

  <div class="linha">
    <input type="text" name="cpf" placeholder="CPF" [(ngModel)]="clientes.cpf" required maxlength="11">
    <!-- Coloquei limite de 11 caracteres CPF-->
    <input type="text" name="rg" placeholder="RG" [(ngModel)]="clientes.rg" required maxlength="9">
    <!-- Coloquei limite de 9 caracteres RG-->
  </div>

  <div class="linha">
    <input type="email" name="email" placeholder="E-mail" [(ngModel)]="clientes.email">
  </div>

  <div class="linha">
    <input type="password" name="senha" placeholder="Senha" [(ngModel)]="clientes.senha">
    <input type="password" name="confirmarSenha" placeholder="Confirmar senha" [(ngModel)]="confirmarSenha">
  </div>

  <label class="termos">
    <input type="checkbox" name="termos" [(ngModel)]="aceitouTermos">
    Estou ciente e CONCORDO com os Termos de Serviço e Política de Privacidade da OverHub.
  </label>

  <button type="button" (click)="salvar()">CRIAR CONTA</button>
</form>
