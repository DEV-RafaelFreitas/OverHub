name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ test/deploy ]

# Permissões necessárias para a publicação oficial do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install specific npm version
        run: npm install -g npm@12.0.2

      - name: Verify versions
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm ci

      - name: Build
        # Lembre-se de respeitar letras maiúsculas/minúsculas do nome do seu repositório no GitHub
        run: npx ng build --configuration production --base-href /OverHub/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/overhub/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4